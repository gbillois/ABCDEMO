<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<!-- Icône du Domaine des Pins, dessinée en code : la bulle de l'Aquaparc et son toboggan, les grands pins, le lac et un canard en plastique. -->
<defs>
  <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b8fe0"/><stop offset=".55" stop-color="#7cc8f2"/><stop offset="1" stop-color="#d9f2ff"/></linearGradient>
  <radialGradient id="soleil" cx=".8" cy=".16" r=".34"><stop offset="0" stop-color="#fffbe0"/><stop offset=".18" stop-color="#ffe98a"/><stop offset=".45" stop-color="#ffe28a" stop-opacity=".35"/><stop offset="1" stop-color="#ffe28a" stop-opacity="0"/></radialGradient>
  <linearGradient id="foret" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d8a5a"/><stop offset="1" stop-color="#2c6b45"/></linearGradient>
  <radialGradient id="bulle" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff" stop-opacity=".5"/><stop offset=".35" stop-color="#d8f4ff" stop-opacity=".15"/><stop offset="1" stop-color="#8fd6f5" stop-opacity=".3"/></radialGradient>
  <linearGradient id="piscine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ae6f7"/><stop offset="1" stop-color="#18a6dc"/></linearGradient>
  <linearGradient id="lac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fb3e6"/><stop offset=".5" stop-color="#1680c4"/><stop offset="1" stop-color="#0d5d9a"/></linearGradient>
  <linearGradient id="tube" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a5c"/><stop offset=".6" stop-color="#ec2f2a"/><stop offset="1" stop-color="#b3141c"/></linearGradient>
  <linearGradient id="pin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d5a35"/><stop offset=".55" stop-color="#2e7d4a"/><stop offset="1" stop-color="#1a4d2e"/></linearGradient>
  <linearGradient id="canard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe45c"/><stop offset="1" stop-color="#f5b800"/></linearGradient>
  <clipPath id="dome"><path d="M232 640 A280 300 0 0 1 792 640 Z"/></clipPath>
</defs>
<rect width="1024" height="1024" fill="url(#ciel)"/>
<rect width="1024" height="1024" fill="url(#soleil)"/>
<circle cx="820" cy="165" r="62" fill="#fff6c4"/>
<!-- petits nuages -->
<g fill="#ffffff" opacity=".92"><ellipse cx="190" cy="190" rx="95" ry="38"/><ellipse cx="250" cy="165" rx="62" ry="44"/><ellipse cx="140" cy="172" rx="48" ry="32"/></g>
<!-- la forêt au loin -->
<path d="M0 600 L0 520 L40 470 L70 520 L105 455 L140 520 L175 470 L205 525 L240 480 L270 540 L760 540 L790 470 L825 525 L860 455 L895 520 L930 465 L965 525 L1000 475 L1024 510 L1024 600 Z" fill="url(#foret)"/>
<rect x="0" y="590" width="1024" height="60" fill="#5aa848"/>
<!-- la bulle de l'Aquaparc -->
<g clip-path="url(#dome)">
  <rect x="232" y="330" width="560" height="320" fill="#bfe9fb"/>
  <rect x="300" y="575" width="420" height="60" rx="12" fill="url(#piscine)"/>
  <path d="M320 600 q40 -14 80 0 t80 0 t80 0 t80 0 t80 0" stroke="#ffffff" stroke-width="7" fill="none" opacity=".7"/>
  <!-- la tour et le toboggan en colimaçon -->
  <rect x="566" y="395" width="44" height="200" rx="8" fill="#f4f4f4"/>
  <rect x="566" y="420" width="44" height="22" fill="#ec2f2a"/><rect x="566" y="470" width="44" height="22" fill="#ec2f2a"/><rect x="566" y="520" width="44" height="22" fill="#ec2f2a"/>
  <path d="M548 392 L628 392 L612 372 L564 372 Z" fill="#ec2f2a"/>
  <path d="M575 405 C470 405 455 455 520 465 C640 480 650 515 560 525 C460 535 440 575 520 590 L470 600" stroke="#8a1015" stroke-width="44" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".35" transform="translate(6 8)"/>
  <path d="M575 405 C470 405 455 455 520 465 C640 480 650 515 560 525 C460 535 440 575 520 590 L470 600" stroke="url(#tube)" stroke-width="40" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M575 398 C478 398 462 448 522 457 C636 472 642 506 562 517" stroke="#ffd0c4" stroke-width="7" fill="none" stroke-linecap="round" opacity=".8"/>
  <!-- un palmier dans la bulle -->
  <path d="M352 600 C356 540 350 500 362 460" stroke="#9b6b3d" stroke-width="16" fill="none" stroke-linecap="round"/>
  <g fill="#2fa65a"><path d="M362 460 C330 440 300 450 280 470 C312 462 335 466 362 462 Z"/><path d="M362 460 C392 436 425 440 446 458 C414 454 390 458 362 462 Z"/><path d="M362 460 C352 425 330 410 305 410 C330 425 345 440 360 462 Z"/><path d="M362 460 C375 425 398 412 422 414 C400 428 383 442 364 462 Z"/></g>
</g>
<path d="M232 640 A280 300 0 0 1 792 640 Z" fill="url(#bulle)"/>
<g stroke="#ffffff" stroke-width="7" fill="none" opacity=".85">
  <path d="M232 640 A280 300 0 0 1 792 640"/>
  <path d="M372 640 A140 300 0 0 1 652 640"/><path d="M512 340 L512 640"/>
  <path d="M262 520 Q512 470 762 520"/><path d="M316 420 Q512 385 708 420"/>
</g>
<path d="M300 520 A230 250 0 0 1 430 380" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round" opacity=".7"/>
<rect x="216" y="632" width="592" height="22" rx="10" fill="#e9eef2"/>
<!-- le lac devant, avec des vaguelettes -->
<path d="M0 690 Q512 650 1024 690 L1024 1024 L0 1024 Z" fill="url(#lac)"/>
<path d="M0 680 Q512 642 1024 680 L1024 700 Q512 662 0 700 Z" fill="#e7d3a3"/>
<g stroke="#bfeeff" stroke-width="8" fill="none" stroke-linecap="round" opacity=".7">
  <path d="M120 780 q30 -12 60 0 t60 0"/><path d="M380 850 q30 -12 60 0 t60 0"/><path d="M160 930 q30 -12 60 0 t60 0"/><path d="M820 960 q30 -12 60 0 t60 0"/>
</g>
<!-- les deux grands pins qui encadrent le domaine, sur leurs petites plages -->
<ellipse cx="113" cy="965" rx="150" ry="40" fill="#e7d3a3"/><ellipse cx="908" cy="985" rx="150" ry="40" fill="#e7d3a3"/>
<g>
  <rect x="96" y="840" width="34" height="120" fill="#6b4a2f"/>
  <path d="M113 360 L40 520 L80 516 L18 660 L72 652 L0 820 L70 812 L-10 900 L240 900 L170 812 L232 820 L170 652 L210 660 L150 516 L190 520 Z" fill="url(#pin)"/>
  <path d="M113 360 L150 516 L190 520 L170 520 Z M80 516 L113 470 L90 520 Z" fill="#4aa36a" opacity=".55"/>
</g>
<g>
  <rect x="890" y="860" width="36" height="120" fill="#6b4a2f"/>
  <path d="M908 400 L838 545 L876 541 L816 680 L866 672 L798 840 L866 832 L790 915 L1030 915 L960 832 L1022 840 L956 672 L1004 680 L944 541 L980 545 Z" fill="url(#pin)"/>
  <path d="M908 400 L944 541 L980 545 L962 545 Z" fill="#4aa36a" opacity=".55"/>
</g>
<!-- le canard en plastique, ta mission -->
<g transform="translate(600 815)">
  <ellipse cx="0" cy="92" rx="150" ry="22" fill="#0b4f86" opacity=".35"/>
  <path d="M-130 30 C-140 -30 -80 -60 -10 -50 C40 -44 70 -20 120 -40 C150 -50 160 -20 140 10 C120 60 70 92 -20 92 C-90 92 -125 70 -130 30 Z" fill="url(#canard)"/>
  <path d="M-150 -10 C-170 -30 -170 -60 -140 -70 C-140 -45 -128 -25 -112 -10 Z" fill="#f5b800"/>
  <circle cx="40" cy="-110" r="78" fill="url(#canard)"/>
  <path d="M100 -100 C150 -112 175 -95 170 -80 C150 -70 120 -72 98 -78 Z" fill="#ff8a1a"/>
  <path d="M98 -80 C130 -72 160 -72 168 -80 C160 -62 120 -58 100 -66 Z" fill="#e8650a"/>
  <circle cx="58" cy="-128" r="13" fill="#1b1b1b"/><circle cx="62" cy="-133" r="4.5" fill="#ffffff"/>
  <path d="M-60 0 C-20 -18 30 -10 50 20" stroke="#f0a800" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="10" cy="-150" rx="26" ry="12" fill="#ffffff" opacity=".55" transform="rotate(-20 10 -150)"/>
</g>
</svg>
